<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solution Point - Smart Print</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-indigo-600">Solution Point</h1>
            <p class="text-sm text-slate-500">Scan, Upload & Print Instantly</p>
        </div>

        <form id="printForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Upload Document (PDF / Image)</label>
                <input type="file" id="fileInput" accept=".pdf,image/*" required
                    class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-xl p-1"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Print Type</label>
                <select id="printType" class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="bw">Black & White (₹2 / page)</option>
                    <option value="color">Colour (₹10 / page)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Number of Copies</label>
                <input type="number" id="copies" value="1" min="1" max="100"
                    class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"/>
            </div>

            <div class="bg-indigo-50 rounded-xl p-4 space-y-2 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-600">Total Pages:</span>
                    <span id="pageCountDisplay" class="font-semibold text-slate-900">0</span>
                </div>
                <div class="flex justify-between text-base font-bold text-indigo-700 pt-2 border-t border-indigo-100">
                    <span>Total Amount:</span>
                    <span id="totalAmountDisplay">₹0</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
                Send to Printer & Generate QR
            </button>
        </form>

        <!-- Dynamic QR Section with Pre-filled Amount -->
        <div id="payContainer" class="hidden space-y-4 pt-2 text-center">
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3">
                <p class="text-xs text-emerald-800 font-semibold">✓ File sent to shop printer successfully!</p>
                <p class="text-xl font-bold text-emerald-700 mt-1">Amount: <span id="finalAmountText">₹0</span></p>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
                <p class="text-xs font-semibold text-slate-700">Scan this QR code in GPay, PhonePe or Paytm</p>
                <p class="text-[11px] text-indigo-600 font-medium">(Amount will fill automatically upon scanning)</p>
                <div class="flex justify-center">
                    <img id="qrImage" src="" alt="Pre-filled UPI QR" class="w-48 h-48 border rounded-xl shadow-sm bg-white p-2"/>
                </div>
            </div>

            <button onclick="location.reload()" class="w-full bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl hover:bg-slate-300 transition text-sm">
                Print Another Document
            </button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let detectedPages = 1;
        let calculatedTotal = 0;

        const fileInput = document.getElementById('fileInput');
        const printTypeSelect = document.getElementById('printType');
        const copiesInput = document.getElementById('copies');
        const pageCountDisplay = document.getElementById('pageCountDisplay');
        const totalAmountDisplay = document.getElementById('totalAmountDisplay');

        const TELEGRAM_BOT_TOKEN = "8776483973:AAEGJyO3MQeZgDoOxngfw6EqPmDO9dvaIVc";
        const TELEGRAM_CHAT_ID = "643383513";

        async function updateCost() {
            const printType = printTypeSelect.value;
            const copies = parseInt(copiesInput.value) || 1;
            const rate = printType === 'bw' ? 2 : 10;
            calculatedTotal = detectedPages * rate * copies;
            
            pageCountDisplay.textContent = detectedPages;
            totalAmountDisplay.textContent = `₹${calculatedTotal}`;
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const loadingTask = pdfjsLib.getDocument({ data: typedarray });
                        const pdf = await loadingTask.promise;
                        detectedPages = pdf.numPages;
                    } catch (err) {
                        detectedPages = 1;
                    }
                    updateCost();
                };
                reader.readAsArrayBuffer(file);
            } else {
                detectedPages = 1;
                updateCost();
            }
        });

        printTypeSelect.addEventListener('change', updateCost);
        copiesInput.addEventListener('input', updateCost);

        document.getElementById('printForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file || calculatedTotal <= 0) {
                alert('Please upload a valid document first.');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.textContent = "Sending to printer...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('document', file);
            formData.append('caption', `🖨️ New Print Order!\nType: ${printTypeSelect.value.toUpperCase()}\nCopies: ${copiesInput.value}\nPages: ${detectedPages}\nTotal: ₹${calculatedTotal}`);

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error(err);
            }

            // Generate UPI URL with pre-filled amount encoded inside the QR code
            const shopUpiID = "7029059551@okbizaxis"; 
            const shopName = "Solution Point";
            const upiUrl = `upi://pay?pa=${shopUpiID}&pn=${encodeURIComponent(shopName)}&am=${calculatedTotal}&cu=INR`;
            
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
            
            document.getElementById('qrImage').src = qrApiUrl;
            document.getElementById('finalAmountText').textContent = `₹${calculatedTotal}`;
            
            document.getElementById('printForm').classList.add('hidden');
            document.getElementById('payContainer').classList.remove('hidden');
        });
    </script>
</body>
</html>
